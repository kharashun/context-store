[project]
name = "context-store"
version = "0.1.0"
description = "Local persistent memory for AI agents, exposed as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ihar Kharashun" }]
dependencies = ["fastmcp>=4.0"]

[project.scripts]
context-store = "context_store.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
